<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club Sign-up</title>
    <style>
        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 100px 20px 200px 20px;
            font-family: Arial, sans-serif;
        }

        form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.1);
        }

        input[type="text"], 
         input[type="email"], 
         input[type="tel"], 
         select,
         input[type="search"] {
             width: 100%;
             padding: 10px;
             margin: 5px 10px 15px 0;
             border: 1px solid #ccc;
             border-radius: 4px;
         }

        .form-group {
            margin-left: 10px;
            margin-bottom: 15px;
            padding-right: 30px;
        }

        .radio-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>
<body>
    <main>
        <form>
           <h2>Sign up for the Coding Club!</h2>
           <p>Fill out the form below to join our coding club and stay updated on our latest events and activities.</p>
           <div class ="form-group">
            <label for="search">Search Past Events:</label>
            <input type="search" id="search" name="search">
            </div>
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="row">
                <div class="form-group">
                    <label for="Email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                    <label for=""phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
            </div>
            <div class="form-group">
                <label for="majors">Major:</label>
                <select id="majors" name="majors" required>
                    <option value="">Select your major</option>
                    <Optgroup label="Computer Science and IT">
                        <option value="computer-science">Computer Science</option>
                        <option value="information-technology">Information Technology</option>
                    </Optgroup>
                    <Optgroup label="Engineering">
                        <option value="electrical-engineering">Electrical Engineering</option>
                        <option value="mechanical-engineering">Mechanical Engineering</option>
                    </Optgroup>
                </select>
            </div>
            <div class="form-group">
                <label for="year">Membership plan:</label>
                <div class="radio-group">
                    <input type="radio" id="year1" name="year" value="basic" required>
                    <label for="year1">1 Year</label>
                    <input type="radio" id="year2" name="year" value="premium">
                    <label for="year2">2 Years</label>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
